[project]
name = "semif-local-server"
version = "0.2.0"
description = "Local HTTP decision server for SemIf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "huggingface-hub",
    "semif-phase1[mlx]",
]

[project.optional-dependencies]
llamacpp = [
    "semif-phase1[llamacpp]",
]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
semif-server = "semif_server.__main__:main"

[tool.uv.sources]
semif-phase1 = { git = "https://github.com/TheoLeeCJ/SemIf.git", rev = "1f2dea3e25379f9dfc98cb83c324f00ab5deda37" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semif_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
