[project]
name = "deqio"
version = "0.5.6"
description = "Unified runtime for fast typed AI decisions across multiple decision engines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "huggingface-hub>=1,<2",
    "pydantic>=2,<3",
]
keywords = ["ai", "llm", "decision", "jev", "system-one", "inference", "mlx", "mps", "cuda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/ILuce/deqio"
Issues = "https://github.com/ILuce/deqio/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.16,<0.17",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
deqio = "deqio.cli:main"


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deqio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness-only rule set (pyflakes + pycodestyle error classes). Style and
# import ordering are deliberately not enforced in 0.5.x to keep patches small.
select = ["E4", "E7", "E9", "F"]
