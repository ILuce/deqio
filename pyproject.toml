[project]
name = "deqio"
version = "0.1.0"
description = "Unified runtime for fast typed AI decisions across multiple decision engines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "huggingface-hub",
    "semif-phase1[mlx]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
deqio = "deqio.cli:main"

[tool.uv.sources]
semif-phase1 = { git = "https://github.com/TheoLeeCJ/SemIf.git", rev = "1f2dea3e25379f9dfc98cb83c324f00ab5deda37" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deqio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
