[project]
name = "deqio"
version = "0.1.0"
description = "Unified runtime for fast typed AI decisions across multiple decision engines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "huggingface-hub",
]
keywords = ["ai", "llm", "decision", "jev", "system-one", "inference", "mlx", "mps", "cuda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/ILuce/deqio"
Issues = "https://github.com/ILuce/deqio/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
deqio = "deqio.cli:main"


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deqio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
