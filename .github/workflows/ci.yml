name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared minimum (requires-python >=3.10); 3.12 is the
        # development interpreter pinned in .python-version.
        python-version: ["3.10", "3.12"]
    env:
      # Overrides .python-version for every uv command in this job, so
      # `uv run` keeps using the matrix interpreter instead of recreating
      # the environment with 3.12.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install the locked development environment
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen ruff check src tests

      - name: Byte-compile sources and tests
        run: uv run --frozen python -m compileall -q src tests

      - name: Run test suite
        run: uv run --frozen pytest -q
